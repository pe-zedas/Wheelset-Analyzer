# Kundenprofil Abellio (neues Schema, 23 Spalten)
name: abellio
description: Abellio - neues Schema mit MIN_BEREICH/MAX_BEREICH und LASTUPDATE

csv:
  delimiter: ";"
  encoding: "utf-8-sig"
  date_format: "%Y-%m-%d %H:%M:%S"
  decimal: "."

columns_raw:
  TOPEINHEITID: topeinheit_id
  TOPEINHEITBEZEICHNUNG: topeinheit_bez
  DGEINHEITID: dg_id
  DGBEZEICHNUNG: dg_bez
  DGEINBAUPOS: dg_einbaupos
  RSEINHEITID: rs_id
  RSBEZEICHNUNG: rs_bez
  RSEINBAUPOS: rs_einbaupos
  EINBAU: einbau
  AUSBAU: ausbau
  AKTUELL: aktuell
  ZAEHLERARTID: zaehlerart_id
  ZARTBEZ: zartbez
  ZAEHLERHISTORIEID: zaehlerhistorie_id
  STAND: stand
  DATUM: datum
  MIN: min_val
  MAX: max_val
  MIN_BEREICH: gelb_min
  MAX_BEREICH: gelb_max
  LAUFLEISTUNG: laufleistung
  LASTRUNID: lastrun_id
  LASTUPDATE: letzteaendzeit

columns_prognose:
  TOPEINHEITID: topeinheit_id
  DGEINHEITID: dg_id
  RSEINHEITID: rs_id
  ZARTBEZ: zartbez
  STAND: stand
  DATUM: datum
  LAUFLEISTUNG: laufleistung
  LASTUPDATE: letzteaendzeit
  KM_WARNWERT: km_warnwert
  DATUM_WARNWERT: datum_warnwert
  KM_GRENZWERT: km_grenzwert
  DATUM_GRENZWERT: datum_grenzwert
  AKTUELL: aktuell
  AUSBAU: ausbau

# Lt. ZAR-3219: MIN/MAX/MIN_BEREICH/LAUFLEISTUNG oft leer -> gelockerte Base-Pflicht
required_measurement_fields:
  base: [datum, stand]
  prognosis_eligible: [datum, stand, laufleistung, min_val, max_val, gelb_min]

hierarchy_depth: 4

measurement_catalog:
  LKD:
    patterns:
      - regex: "^Laufkreisdurchmesser Dlk(\\s*\\[.*(L|links|gauche).*\\])?\\s*(links)?$"
        side: left
      - regex: "^Laufkreisdurchmesser Dlk(\\s*\\[.*(R|rechts|droite).*\\])?\\s*(rechts)?$"
        side: right
      - regex: "^Laufkreisdurchmesser Dlk$"
        side: unspecified
    unit: mm
    direction: decreasing
    prognosis: true
  SPURKRANZDICKE_SD:
    patterns:
      - regex: "^Rad-Spurkranzdicke Sd.*(L|links)"
        side: left
      - regex: "^Rad-Spurkranzdicke Sd.*(R|rechts)"
        side: right
    unit: mm
    direction: decreasing
    prognosis: false
  SPURKRANZHOEHE_SH:
    patterns:
      - regex: "^Rad-Spurkranzhöhe Sh.*(L|links)"
        side: left
      - regex: "^Rad-Spurkranzhöhe Sh.*(R|rechts)"
        side: right
    unit: mm
    direction: increasing
    prognosis: false
  SPURKRANZFLANKE_QR:
    patterns:
      - regex: "^Rad-Spurkranzflankenmaß qR.*(L|links)"
        side: left
      - regex: "^Rad-Spurkranzflankenmaß qR.*(R|rechts)"
        side: right
    unit: mm
    direction: decreasing
    prognosis: false
  HOHLLAUF:
    patterns:
      - regex: "^Auswalzung \\(Hohllauf\\).*(L|links)"
        side: left
      - regex: "^Auswalzung \\(Hohllauf\\).*(R|rechts)"
        side: right
    unit: mm
    direction: increasing
    prognosis: false
