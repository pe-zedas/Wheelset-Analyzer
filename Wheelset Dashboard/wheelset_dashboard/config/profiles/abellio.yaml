# Kundenprofil Abellio (Schema mit MIN_BEREICH/MAX_BEREICH, ohne GELB_MIN/GELB_MAX)
#
# Auf Basis der echten Daten (BO_RADSATZDATEN, ~120 000 Zeilen, 2018-2022):
#  - Messgroessen tragen die Radseite uneinheitlich im Namen:
#      "Laufkreisdurchmesser Dlk links"
#      "Laufkreisdurchmesser Dlk [Radscheibe Laufradsatz (L)]"
#      "Laufkreisdurchmesser Dlk [Radscheibe Treibradsatz (L)]"
#      "Laufkreisdurchmesser Dlk [Radscheibe links]"
#      "Laufkreisdurchmesser Dlk"   (ohne Seite, Messung am Drehgestell)
#  - Struktur ist uneinheitlich: Zeilen mit DG+Radsatz, nur mit DG, oder nur
#    auf Einheitenebene (ohne DG/Radsatz).
#  - DGEINBAUPOS ist nicht eindeutig (viele DG heissen "Drehgestell").
#  - STAND = 0 ist ein Platzhalter ohne Messung (~1/3 der Durchmesser-Zeilen).
#  - LKD hat keine Grenzwerte (MIN/MAX/MIN_BEREICH leer) -> Ampel grau.
#  - Nicht angezeigt (keine Spalte im Dashboard): Bremsscheiben, Rund-/Planlauf-
#    abweichung, Durchmesser Differenz.
name: abellio
description: Abellio - Toleranzbereiche (MIN_BEREICH/MAX_BEREICH), uneinheitliche Struktur

csv:
  delimiter: ";"
  encoding: "utf-8-sig"
  date_format: "%Y-%m-%d %H:%M:%S"
  decimal: "."

# Nicht gelesen (im Dashboard ungenutzt): ZAEHLERHISTORIEID, LASTRUNID, LASTUPDATE
columns_raw:
  TOPEINHEITID: topeinheit_id
  TOPEINHEITBEZEICHNUNG: topeinheit_bez
  DGEINHEITID: dg_id
  DGBEZEICHNUNG: dg_bez
  DGEINBAUPOS: dg_einbaupos
  RSEINHEITID: rs_id
  RSBEZEICHNUNG: rs_bez
  RSEINBAUPOS: rs_einbaupos
  EINBAU: einbau
  AUSBAU: ausbau
  AKTUELL: aktuell
  ZAEHLERARTID: zaehlerart_id
  ZARTBEZ: zartbez
  STAND: stand
  DATUM: datum
  MIN: min_val
  MAX: max_val
  MIN_BEREICH: bereich_min
  MAX_BEREICH: bereich_max
  LAUFLEISTUNG: laufleistung

# BO_RADSATZDATEN_PROGNOSE hat dieselben Spalten wie bei VGF (LETZTEAENDZEIT).
columns_prognose:
  TOPEINHEITID: topeinheit_id
  DGEINHEITID: dg_id
  RSEINHEITID: rs_id
  ZARTBEZ: zartbez
  STAND: stand
  DATUM: datum
  LAUFLEISTUNG: laufleistung
  LETZTEAENDZEIT: letzteaendzeit
  KM_WARNWERT: km_warnwert
  DATUM_WARNWERT: datum_warnwert
  KM_GRENZWERT: km_grenzwert
  DATUM_GRENZWERT: datum_grenzwert
  AKTUELL: aktuell
  AUSBAU: ausbau

required_measurement_fields:
  base: [datum, stand]
  prognosis_eligible: [datum, stand, laufleistung, min_val, max_val]

hierarchy_depth: 4

structure:
  # DGEINBAUPOS ist nicht eindeutig -> Drehgestelle ueber DGEINHEITID fuehren.
  dg_key: id
  # Zeilen ohne Radsatz (nur Einheit oder nur DG) bekommen eine Sammel-Achse
  # "(Radsatz-Zuordnung fehlt)", damit sie im Diagramm erscheinen. Achtung: an
  # einem Zaehler haengen dort mehrere Achsen (bis zu 9 Werte je Tag), die sich
  # ohne Achs-ID nicht trennen lassen.
  fallback_axle: true

thresholds:
  # MIN_BEREICH/MAX_BEREICH sind je Messgroesse konstante Toleranzbereiche
  # (z.B. Sh 26-36, Sd 27.5-33, Spurmass 1415-1426) und gelten als Grenzwerte
  # (rot), wenn MIN/MAX leer sind. Ein Gelb-Band gibt es bei Abellio nicht.
  bereich_as_limits: true

# valid_range: Werte ausserhalb werden verworfen (0 = Platzhalter ohne Messung).
# Bei Hohllauf/Ueberwalzung ist 0 ein gueltiger Messwert -> kein Bereich.
measurement_catalog:
  LKD:
    patterns:
      - regex: '^Laufkreisdurchmesser Dlk(?:\s+links|\s*\[[^\]]*(?:\(L\)|links)\])$'
        side: left
      - regex: '^Laufkreisdurchmesser Dlk(?:\s+rechts|\s*\[[^\]]*(?:\(R\)|rechts)\])$'
        side: right
      - regex: '^Laufkreisdurchmesser Dlk$'
        side: unspecified
    unit: mm
    direction: decreasing
    prognosis: true
    valid_range: [300, 1500]
  SPURKRANZDICKE_SD:
    patterns:
      - regex: '^Rad-Spurkranzdicke Sd(?:\s+links|\s*\[[^\]]*(?:\(L\)|links)\])$'
        side: left
      - regex: '^Rad-Spurkranzdicke Sd(?:\s+rechts|\s*\[[^\]]*(?:\(R\)|rechts)\])$'
        side: right
      - regex: '^Rad-Spurkranzdicke Sd$'
        side: unspecified
    unit: mm
    direction: decreasing
    prognosis: false
    valid_range: [10, 60]
  SPURKRANZHOEHE_SH:
    patterns:
      - regex: '^Rad-Spurkranzhöhe Sh(?:\s+links|\s*\[[^\]]*(?:\(L\)|links)\])$'
        side: left
      - regex: '^Rad-Spurkranzhöhe Sh(?:\s+rechts|\s*\[[^\]]*(?:\(R\)|rechts)\])$'
        side: right
      - regex: '^Rad-Spurkranzhöhe Sh$'
        side: unspecified
    unit: mm
    direction: increasing
    prognosis: false
    valid_range: [10, 60]
  SPURKRANZFLANKE_QR:
    patterns:
      - regex: '^Rad-Spurkranzflankenmaß qR(?:\s+links|\s*\[[^\]]*(?:\(L\)|links)\])$'
        side: left
      - regex: '^Rad-Spurkranzflankenmaß qR(?:\s+rechts|\s*\[[^\]]*(?:\(R\)|rechts)\])$'
        side: right
      - regex: '^Rad-Spurkranzflankenmaß qR$'
        side: unspecified
    unit: mm
    direction: decreasing
    prognosis: false
    valid_range: [1, 30]
  HOHLLAUF:
    patterns:
      - regex: '^Auswalzung \(Hohllauf\)(?:\s+links|\s*\[[^\]]*(?:\(L\)|links)\])$'
        side: left
      - regex: '^Auswalzung \(Hohllauf\)(?:\s+rechts|\s*\[[^\]]*(?:\(R\)|rechts)\])$'
        side: right
      - regex: '^Auswalzung \(Hohllauf\)$'
        side: unspecified
    unit: mm
    direction: increasing
    prognosis: false
  UEBERWALZUNG:
    patterns:
      - regex: '^Überwalzung(?:\s+links|\s*\[[^\]]*(?:\(L\)|links)\])$'
        side: left
      - regex: '^Überwalzung(?:\s+rechts|\s*\[[^\]]*(?:\(R\)|rechts)\])$'
        side: right
      - regex: '^Überwalzung$'
        side: unspecified
    unit: mm
    direction: increasing
    prognosis: false
  RADBREITE:
    patterns:
      - regex: '^Radbreite(?:\s+links|\s*\[[^\]]*(?:\(L\)|links)\])$'
        side: left
      - regex: '^Radbreite(?:\s+rechts|\s*\[[^\]]*(?:\(R\)|rechts)\])$'
        side: right
      - regex: '^Radbreite$'
        side: unspecified
    unit: mm
    direction: decreasing
    prognosis: false
    valid_range: [100, 200]
  SPURMASS_SR:
    patterns:
      - regex: '^Rad-Spurmaß SR$'
        side: unspecified
    unit: mm
    direction: both
    prognosis: false
    valid_range: [1300, 1600]
  STICHMASS_ABSTAND:
    patterns:
      - regex: '^Radinnenabstand AR$'
        side: unspecified
    unit: mm
    direction: both
    prognosis: false
    valid_range: [1300, 1600]
