# Kundenprofil MOB (Montreux-Oberland-Bahn, franzoesische Zaehlerbezeichnungen)
#
# Auf Basis der echten Daten (BO_RADSATZDATEN, 104 Zeilen, 08/2024 - 01/2025):
#  - Nur Drehgestell-Ebene: RSEINHEITID/RSEINBAUPOS sind immer leer.
#  - Je Drehgestell und Messtermin gibt es 4 Werte im Minutenabstand (die vier
#    Raeder des Drehgestells) unter demselben Zaehler, ohne Seiten- oder
#    Achsangabe. Sie werden nach der Messreihenfolge auf "Messposition 1..4"
#    verteilt (structure.wheel_positions). Die Zuordnung zur Radnummer am
#    Fahrzeug ist daraus nicht belegt.
#  - Es gibt weder LAUFLEISTUNG noch Grenzwerte (MIN/MAX/MIN_BEREICH leer) ->
#    Ampel grau, keine Prognose moeglich.
#  - Bezeichnungen tragen teils Leerzeichen am Ende ("Creux ", "Cote qR ").
#  - "Creux" (Hohllauf) ist durchgehend 0 - das ist hier ein gueltiger Messwert.
#  - Prognose-Tabelle hat dieselben Spalten wie bei VGF (LETZTEAENDZEIT).
name: mob
description: Montreux-Oberland-Bahn - nur Drehgestell-Ebene, vier Raeder je Zaehler, franzoesische Bezeichnungen

csv:
  delimiter: ";"
  encoding: "utf-8-sig"
  date_format: "%Y-%m-%d %H:%M:%S"
  decimal: "."

# Nicht gelesen (im Dashboard ungenutzt): ZAEHLERHISTORIEID, LASTRUNID, LASTUPDATE
columns_raw:
  TOPEINHEITID: topeinheit_id
  TOPEINHEITBEZEICHNUNG: topeinheit_bez
  DGEINHEITID: dg_id
  DGBEZEICHNUNG: dg_bez
  DGEINBAUPOS: dg_einbaupos
  RSEINHEITID: rs_id
  RSBEZEICHNUNG: rs_bez
  RSEINBAUPOS: rs_einbaupos
  EINBAU: einbau
  AUSBAU: ausbau
  AKTUELL: aktuell
  ZAEHLERARTID: zaehlerart_id
  ZARTBEZ: zartbez
  STAND: stand
  DATUM: datum
  MIN: min_val
  MAX: max_val
  MIN_BEREICH: bereich_min
  MAX_BEREICH: bereich_max
  LAUFLEISTUNG: laufleistung

columns_prognose:
  TOPEINHEITID: topeinheit_id
  DGEINHEITID: dg_id
  RSEINHEITID: rs_id
  ZARTBEZ: zartbez
  STAND: stand
  DATUM: datum
  LAUFLEISTUNG: laufleistung
  LETZTEAENDZEIT: letzteaendzeit
  KM_WARNWERT: km_warnwert
  DATUM_WARNWERT: datum_warnwert
  KM_GRENZWERT: km_grenzwert
  DATUM_GRENZWERT: datum_grenzwert
  AKTUELL: aktuell
  AUSBAU: ausbau

required_measurement_fields:
  base: [datum, stand]
  prognosis_eligible: [datum, stand, laufleistung, min_val, max_val]

# Das Dashboard navigiert immer Einheit > Drehgestell > Achse > Diagramm. Ohne
# Radsatz-Ebene haengen die Messwerte an einer Sammel-Achse, damit sie ueber das
# Diagramm erreichbar sind (sonst blieben sie nur in der Status-Summe sichtbar).
hierarchy_depth: 4

structure:
  # DG-Position ("Bogie EV 1 (IO)") ist bei allen Drehgestellen gleich und ein
  # Drehgestell wechselt die Einheit -> ueber die DG-ID fuehren.
  dg_key: id
  fallback_axle: true
  # Je Messtermin liefert die Messanlage 4 Werte je Messgroesse nacheinander
  # (Abstand ca. 1 Minute). Der k-te Wert eines Termins -> "Messposition k"
  # (Messreihenfolge, nicht nachgewiesen die Radnummer am Fahrzeug). Termine mit
  # einer anderen Anzahl Werte bleiben in der Sammel-Achse.
  wheel_positions: 4

thresholds:
  # In der MOB-Datenbank sind die Spalten derzeit leer. Gleiches Schema wie
  # Abellio, dort sind MIN_BEREICH/MAX_BEREICH Toleranzbereiche (Grenzwerte).
  bereich_as_limits: true

# valid_range: Werte ausserhalb werden verworfen (0 = Platzhalter ohne Messung).
# Hohllauf ("Creux") und Ueberwalzung ("Refoulement"): 0 ist gueltig -> kein Bereich.
measurement_catalog:
  LKD:
    patterns:
      - regex: '^Diamètre de roue\s*$'
        side: unspecified
    unit: mm
    direction: decreasing
    prognosis: true
    valid_range: [300, 1500]
  SPURKRANZDICKE_SD:
    patterns:
      - regex: '^Epaisseur du boudin\s*$'
        side: unspecified
    unit: mm
    direction: decreasing
    prognosis: false
    valid_range: [10, 60]
  SPURKRANZHOEHE_SH:
    patterns:
      - regex: '^Hauteur du boudin\s*$'
        side: unspecified
    unit: mm
    direction: increasing
    prognosis: false
    valid_range: [10, 60]
  SPURKRANZFLANKE_QR:
    patterns:
      - regex: '^Cote qR\s*$'
        side: unspecified
    unit: mm
    direction: decreasing
    prognosis: false
    valid_range: [1, 30]
  HOHLLAUF:
    patterns:
      - regex: '^Creux\s*$'
        side: unspecified
    unit: mm
    direction: increasing
    prognosis: false
  UEBERWALZUNG:
    patterns:
      - regex: '^Refoulement\s*$'
        side: unspecified
    unit: mm
    direction: increasing
    prognosis: false
  RADBREITE:
    patterns:
      - regex: '^Largeur de roue\s*$'
        side: unspecified
    unit: mm
    direction: decreasing
    prognosis: false
    valid_range: [100, 200]
