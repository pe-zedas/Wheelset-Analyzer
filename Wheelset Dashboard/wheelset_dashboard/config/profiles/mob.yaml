# Kundenprofil MOB (Montreux-Oberland-Bahn, FR, 23 Spalten)
name: mob
description: Montreux-Oberland-Bahn - neues Schema, franzoesische Zaehlerbezeichnungen, teilweise ohne Radsatz-Ebene

csv:
  delimiter: ";"
  encoding: "utf-8-sig"
  date_format: "%Y-%m-%d %H:%M:%S"
  decimal: "."

columns_raw:
  TOPEINHEITID: topeinheit_id
  TOPEINHEITBEZEICHNUNG: topeinheit_bez
  DGEINHEITID: dg_id
  DGBEZEICHNUNG: dg_bez
  DGEINBAUPOS: dg_einbaupos
  RSEINHEITID: rs_id
  RSBEZEICHNUNG: rs_bez
  RSEINBAUPOS: rs_einbaupos
  EINBAU: einbau
  AUSBAU: ausbau
  AKTUELL: aktuell
  ZAEHLERARTID: zaehlerart_id
  ZARTBEZ: zartbez
  ZAEHLERHISTORIEID: zaehlerhistorie_id
  STAND: stand
  DATUM: datum
  MIN: min_val
  MAX: max_val
  MIN_BEREICH: gelb_min
  MAX_BEREICH: gelb_max
  LAUFLEISTUNG: laufleistung
  LASTRUNID: lastrun_id
  LASTUPDATE: letzteaendzeit

columns_prognose:
  TOPEINHEITID: topeinheit_id
  DGEINHEITID: dg_id
  RSEINHEITID: rs_id
  ZARTBEZ: zartbez
  STAND: stand
  DATUM: datum
  LAUFLEISTUNG: laufleistung
  LASTUPDATE: letzteaendzeit
  KM_WARNWERT: km_warnwert
  DATUM_WARNWERT: datum_warnwert
  KM_GRENZWERT: km_grenzwert
  DATUM_GRENZWERT: datum_grenzwert
  AKTUELL: aktuell

required_measurement_fields:
  base: [datum, stand]
  prognosis_eligible: [datum, stand, laufleistung, min_val, max_val, gelb_min]

# MOB-Export hat keine Radsatz-Ebene (RSEINHEITID etc. leer)
hierarchy_depth: 3

measurement_catalog:
  LKD:
    patterns:
      - regex: "^Diamètre de roue\\s*$"
        side: unspecified
    unit: mm
    direction: decreasing
    prognosis: true
  SPURKRANZDICKE_SD:
    patterns:
      - regex: "^Epaisseur du boudin\\s*$"
        side: unspecified
    unit: mm
    direction: decreasing
    prognosis: false
  SPURKRANZHOEHE_SH:
    patterns:
      - regex: "^Hauteur du boudin\\s*$"
        side: unspecified
    unit: mm
    direction: increasing
    prognosis: false
  SPURKRANZFLANKE_QR:
    patterns:
      - regex: "^Cote qR\\s*$"
        side: unspecified
    unit: mm
    direction: decreasing
    prognosis: false
  HOHLLAUF:
    patterns:
      - regex: "^Creux\\s*$"
        side: unspecified
    unit: mm
    direction: increasing
    prognosis: false
  UEBERWALZUNG:
    patterns:
      - regex: "^Refoulement\\s*$"
        side: unspecified
    unit: mm
    direction: increasing
    prognosis: false
  RADBREITE:
    patterns:
      - regex: "^Largeur de roue\\s*$"
        side: unspecified
    unit: mm
    direction: decreasing
    prognosis: false
