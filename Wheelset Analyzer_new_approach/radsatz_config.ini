# Konfiguration Radsatz-Prognose (UTF-8). Pfade unter paths/log_file sind relativ zum Skriptverzeichnis,
# sofern nicht absolut.

[pipeline]
use_database = false
write_prog_data = false

[paths]
oracle_connect_filename = oracle_connect_string.txt
csv_bo_radsatzdaten = bo_radsatzdaten_export.csv
csv_bo_prognose_out = bo_radsatzdaten_prognose_recalc.csv

[oracle]
arraysize = 500

[logging]
log_file = Prog_Radsatzdaten.log

[prognose]
# Vom neuen Hauptskript Radsatz_Bahn_DB_new_Approach.py ausgewertet:
#   dt_start_data, n_km, diff_lkd, n_days_2_delete, prognosis_method
# prognosis_method: einzelne Methode oder Liste:
#   theil_sen
#   gauss
#   theil_sen, gauss   (beide Methoden; gemeinsamer Plot je Achse)
# Zusaetzliche Prognose-Parameter (Theil-Sen / IQR): Abschnitt [prognose_new]
# Gauss zusaetzlich: def_jump_repro, def_param_exp_a0/a1, n_km_repro, n_value_repro
#prognosis_method = gauss
prognosis_method = theil_sen
#prognosis_method = theil_sen,gauss
dt_start_data = 2014-01-01
n_km = 300000
def_jump_repro = -150
n_km_repro = 30000
n_value_repro = 6
# Fallback reprof_learning, wenn weder Achse noch Median (siehe reprof_learning.py)
reprof_dkm_threshold = 5000
reprof_dlkd_abs_min = 3
def_param_exp_a0 = -7.7
def_param_exp_a1 = 0.09
diff_lkd = 20
n_days_2_delete = 14

[prognose_new]
# Parameter fuer Radsatz_Bahn_DB_new_Approach.py (Theil-Sen / IQR / optional Power-Law)
min_points_fit = 3
min_points_quality = 8
iqr_factor = 2.0
ci_alpha = 0.90
rmse_threshold_mm = 0.5
n_prog_points = 20
# Optional: bei Theil-Sen INSUFFICIENT den mittleren Anstieg derselben Baureihe nutzen
baureihe_fallback = false
# Kreuzvalidierung (expanding window) zur Wahl von iqr_factor und min_points_fit
cv_tune = true
cv_tune_iqr_factors = 1.5, 2.0, 2.5
cv_tune_min_points_fit = 3,4, 5
cv_tune_objective = mae
cv_tune_min_total_folds = 30

[plot]
show_plot = true
plot_output_dir =
# Nur Diagramme für Achsen, deren Bezeichnung diesen Text enthält (leer = alle)
# Beispiel: FLIRT 101  oder  FLIRT
plot_top_einheit_filter =
plot_show_window = true
# Vor dem ersten pyplot-Import (sonst bleibt oft TkAgg): Qt5Agg wenn PyQt5 installiert
matplotlib_backend = Qt5Agg
figure_width = 20
figure_height = 8
figure_dpi = 80
# Kommagetrennte Teilstrings: bei Treffer in Fahrzeug|DG|Achse wird der Dictionary-Schlüssel ausgegeben
debug_print_axis_keys =
